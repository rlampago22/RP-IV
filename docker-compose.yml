services:
  postgres:
    image: postgres:16-alpine
    container_name: usina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: usina
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - usina-postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d usina"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  usina-postgres-dados:
