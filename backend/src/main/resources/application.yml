spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: usina-backend
  profiles:
    default: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

app:
  cors-origin: ${APP_CORS_ORIGIN:http://localhost:5173}
  bootstrap-password: ${APP_BOOTSTRAP_PASSWORD:troque-esta-senha}
  reset-bootstrap-passwords: ${APP_RESET_BOOTSTRAP_PASSWORDS:false}
